# RecruitAI — private stack for Dokploy (Compose).
# Git source: https://github.com/Raph13009/recruitai (branch migrate/dokploy-private-pg)
# Test host: recruitai-test.boostaiconsulting.com
# DB has NO public ports. Migration talks to db over recruitai_internal only.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruitai}
      POSTGRES_USER: ${POSTGRES_USER:-recruitai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - recruitai_pg_data:/var/lib/postgresql/data
    networks:
      - recruitai_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-recruitai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recruitai}
      DATABASE_SSL: "false"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      MIGRATE_WIPE: ${MIGRATE_WIPE:-true}
      MIGRATE_CLEAN_WORKDIR: "true"
      RECRUITAI_DATA_DIR: /data
      SCHEMA_PATH: /migrate/deploy/postgres/schema.sql
    volumes:
      - recruitai_branding:/data
    networks:
      - recruitai_internal

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      USE_MOCK_DB: "false"
      DATABASE_URL: postgres://${POSTGRES_USER:-recruitai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recruitai}
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://recruitai-test.boostaiconsulting.com}
      RECRUITAI_DATA_DIR: /data
      ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-false}
      PUBLIC_DEMO: ${PUBLIC_DEMO:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_VOICE: ${GEMINI_VOICE:-Aoede}
      LIVEAVATAR_API_KEY: ${LIVEAVATAR_API_KEY:-}
      LIVEAVATAR_AVATAR_ID: ${LIVEAVATAR_AVATAR_ID:-}
      LIVEAVATAR_SANDBOX: ${LIVEAVATAR_SANDBOX:-true}
      LIVEAVATAR_SANDBOX_VOICE: ${LIVEAVATAR_SANDBOX_VOICE:-Charon}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-RecruitAI <onboarding@resend.dev>}
    volumes:
      - recruitai_branding:/data
    networks:
      - recruitai_internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.recruitai-web.rule=Host(`${TRAEFIK_HOST:-recruitai-test.boostaiconsulting.com}`)
      - traefik.http.routers.recruitai-web.entrypoints=web
      - traefik.http.services.recruitai-web.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruitai}
      POSTGRES_USER: ${POSTGRES_USER:-recruitai}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - recruitai_backups:/backups
      - ./backup-loop.sh:/backup-loop.sh:ro
    networks:
      - recruitai_internal
    entrypoint: ["/bin/sh", "/backup-loop.sh"]

networks:
  recruitai_internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  recruitai_pg_data:
  recruitai_branding:
  recruitai_backups:
